name: Deployment

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Build and push docker images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jax-api:$TAG -f ./deploy/api/Dockerfile .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jax-app:$TAG -f ./deploy/app/Dockerfile ./web
          docker push ${{ secrets.DOCKER_USERNAME }}/jax-api:$TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/jax-app:$TAG
      
      - name: Copy Docker Compose file to EC2
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yaml ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }}:/home/${{ secrets.EC2_USER }}/docker-compose.yaml

      - name: Deploy EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          docker pull ${{ secrets.DOCKER_USERNAME }}/jax-api:$TAG
          docker pull ${{ secrets.DOCKER_USERNAME }}/jax-app:$TAG
          docker-compose -f docker-compose.yaml down
          docker-compose -f docker-compose.yaml up -d

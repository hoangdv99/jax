services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./deploy/api/Dockerfile
    ports:
      - "4000:4000"
    restart: always
    depends_on:
      - mysql
  
  app:
    container_name: app
    build:
      context: ./web
      dockerfile: ../deploy/app/Dockerfile
    ports:
      - "5000:80"
    restart: always

  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
